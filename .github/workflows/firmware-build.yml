name: Firmware build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile provisional ESP32 scaffold
        run: pio run -e sim_esp32dev
